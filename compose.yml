name: fleetprivacy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fleetprivacy
      POSTGRES_USER: fleetprivacy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleetprivacy-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetprivacy -d fleetprivacy"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PRIVACY_CLOUD_DATABASE_URL: postgresql+asyncpg://fleetprivacy:${POSTGRES_PASSWORD:-fleetprivacy-dev}@postgres:5432/fleetprivacy
      PRIVACY_CLOUD_API_KEY: ${PRIVACY_CLOUD_API_KEY:-dev-api-key}
      PRIVACY_CLOUD_ARTIFACT_DIR: /var/lib/fleetprivacy/artifacts
      PRIVACY_CLOUD_WORKER_BATCH_SIZE: ${PRIVACY_CLOUD_WORKER_BATCH_SIZE:-32}
      PRIVACY_CLOUD_LEASE_SECONDS: ${PRIVACY_CLOUD_LEASE_SECONDS:-60}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - artifact-data:/var/lib/fleetprivacy/artifacts
    restart: unless-stopped

volumes:
  postgres-data:
  artifact-data:
