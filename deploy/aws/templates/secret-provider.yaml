apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: fleetprivacy-application
spec:
  provider: aws
  parameters:
    region: {{ .Values.aws.region | quote }}
    usePodIdentity: "true"
    objects: |
      - objectName: {{ .Values.aws.secretArn | quote }}
        objectType: secretsmanager
        jmesPath:
          - path: database_url
            objectAlias: database-url
          - path: api_key
            objectAlias: api-key
          - path: redis_url
            objectAlias: redis-url
          - path: webhook_secret
            objectAlias: webhook-secret
          - path: regional_source_token
            objectAlias: regional-source-token
  secretObjects:
    - secretName: fleetprivacy-application
      type: Opaque
      data:
        - objectName: database-url
          key: database-url
        - objectName: api-key
          key: api-key
        - objectName: redis-url
          key: redis-url
        - objectName: webhook-secret
          key: webhook-secret
        - objectName: regional-source-token
          key: regional-source-token
