apiVersion: apps/v1
kind: Deployment
metadata:
  name: fleetprivacy-api
  labels:
    app.kubernetes.io/name: fleetprivacy
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleetprivacy
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleetprivacy
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: fleetprivacy-api
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: fleetprivacy
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: fleetprivacy-aws
          env:
            - name: PRIVACY_CLOUD_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: fleetprivacy-application
                  key: database-url
            - name: PRIVACY_CLOUD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fleetprivacy-application
                  key: api-key
            - name: PRIVACY_CLOUD_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: fleetprivacy-application
                  key: webhook-secret
          readinessProbe:
            httpGet:
              path: /v1/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /v1/healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
{{ toYaml .Values.resources.api | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: aws-secret
              mountPath: /mnt/secrets-store
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: aws-secret
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: fleetprivacy-application
        - name: tmp
          emptyDir: {}
