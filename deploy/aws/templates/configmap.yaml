apiVersion: v1
kind: ConfigMap
metadata:
  name: fleetprivacy-aws
data:
  PRIVACY_CLOUD_QUEUE_BACKEND: sqs
  PRIVACY_CLOUD_ARTIFACT_BACKEND: s3
  PRIVACY_CLOUD_AWS_REGION: {{ .Values.aws.region | quote }}
  PRIVACY_CLOUD_SQS_QUEUE_URL: {{ .Values.aws.queueUrl | quote }}
  PRIVACY_CLOUD_S3_BUCKET: {{ .Values.aws.bucket | quote }}
  PRIVACY_CLOUD_S3_PREFIX: artifacts
  PRIVACY_CLOUD_S3_KMS_KEY_ID: {{ .Values.aws.kmsKeyArn | quote }}
  PRIVACY_CLOUD_SQS_VISIBILITY_TIMEOUT_SECONDS: "300"
  PRIVACY_CLOUD_SQS_HEARTBEAT_SECONDS: "60"
  PRIVACY_CLOUD_LEASE_SECONDS: "240"
  PRIVACY_CLOUD_MAX_TASK_ATTEMPTS: "5"
  PRIVACY_CLOUD_SOURCE_BACKEND: http
  PRIVACY_CLOUD_REGIONAL_SOURCE_BASE_URL: {{ .Values.aws.regionalSourceBaseUrl | quote }}
  PRIVACY_CLOUD_SOURCE_REQUEST_TIMEOUT_SECONDS: "10"
  PRIVACY_CLOUD_SOURCE_ADMISSION_TIMEOUT_SECONDS: "30"
  PRIVACY_CLOUD_DATABASE_POOL_SIZE: "10"
  PRIVACY_CLOUD_DATABASE_MAX_OVERFLOW: "20"
  PRIVACY_CLOUD_DATABASE_POOL_TIMEOUT_SECONDS: "10"
