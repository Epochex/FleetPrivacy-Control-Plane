apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fleetprivacy-api
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fleetprivacy
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: fleetprivacy-worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fleetprivacy
      app.kubernetes.io/component: worker
